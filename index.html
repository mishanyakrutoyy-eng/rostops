<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>RostOps | AI Бизнес-ассистент</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f8fafc;
            font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .chat-container {
            max-width: 880px;
            width: 100%;
            height: 92vh;
            min-height: 540px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeSlideUp 0.5s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-header {
            padding: 20px 24px 18px 24px;
            background: #ffffff;
            border-bottom: 1px solid #eff2f9;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .avatar-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
            flex-shrink: 0;
        }

        .avatar-icon i {
            font-size: 22px;
            color: white;
        }

        .header-text {
            flex: 1;
        }

        .header-text h2 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #111827;
            font-family: 'Outfit', sans-serif;
        }

        .header-text p {
            font-size: 0.7rem;
            color: #6b7280;
            margin-top: 3px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .server-badge {
            background: #f3f4f6;
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 0.65rem;
            color: #4b5563;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f9fafb;
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #10b981;
            font-weight: 500;
            flex-shrink: 0;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: #ffffff;
            scroll-behavior: smooth;
        }

        .messages-area::-webkit-scrollbar {
            width: 4px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: #f1f1f5;
            border-radius: 10px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 85%;
            animation: messageIn 0.3s ease-out;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message-icon {
            width: 32px;
            height: 32px;
            background: #f3f4f6;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user-icon {
            background: #4f46e5;
            color: white;
        }

        .assistant-icon {
            background: #f3f4f6;
            color: #4f46e5;
        }

        .message-bubble {
            padding: 12px 18px;
            font-size: 0.95rem;
            line-height: 1.55;
            border-radius: 20px;
            word-break: break-word;
        }

        .user-message .message-bubble {
            background: #4f46e5;
            color: white;
            border-radius: 20px 20px 4px 20px;
        }

        .assistant-message .message-bubble {
            background: #f9fafb;
            color: #1f2937;
            border-radius: 20px 20px 20px 4px;
            border: 1px solid #eff2f9;
        }

        .message-time {
            font-size: 0.6rem;
            color: #9ca3af;
            margin-top: 5px;
            margin-left: 8px;
        }

        .user-message .message-time {
            text-align: right;
            margin-right: 4px;
        }

        .message-bubble strong, .message-bubble b {
            font-weight: 700;
            color: #1f2937;
        }
        .user-message .message-bubble strong {
            color: white;
        }
        
        .message-bubble ul, .message-bubble ol {
            margin: 8px 0 8px 24px;
        }
        .message-bubble li {
            margin: 4px 0;
        }
        
        .message-bubble p {
            margin: 8px 0;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f9fafb;
            padding: 10px 16px;
            border-radius: 20px;
            width: fit-content;
            border: 1px solid #eff2f9;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: #9ca3af;
            border-radius: 50%;
            display: inline-block;
            animation: typingFade 1.2s infinite ease;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingFade {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-3px); }
        }

        .input-area {
            padding: 14px 20px 20px;
            background: #ffffff;
            border-top: 1px solid #eff2f9;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: #f9fafb;
            border-radius: 28px;
            padding: 6px 6px 6px 18px;
            border: 1px solid #eef2f8;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
        }

        #userInput {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 0;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            color: #111827;
            resize: none;
            outline: none;
        }

        #userInput::placeholder {
            color: #9ca3af;
        }

        #sendBtn {
            background: #4f46e5;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 44px;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        #sendBtn:hover {
            background: #6366f1;
            transform: scale(0.96);
        }

        .info-footer {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
            font-size: 0.65rem;
            color: #9ca3af;
            flex-wrap: wrap;
            text-align: center;
        }

        @media (max-width: 640px) {
            body { padding: 0; background: #fff; }
            .chat-container { height: 100vh; border-radius: 0; box-shadow: none; }
            .chat-header { padding: 16px; }
            .message { max-width: 92%; }
            .message-bubble { padding: 10px 14px; font-size: 0.88rem; }
            .input-area { padding: 12px; }
            #sendBtn { width: 42px; height: 42px; }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="avatar-icon"><i class="fas fa-brain"></i></div>
        <div class="header-text">
            <h2>RostOps <span style="font-size: 0.7rem;">| AI Business Assistant</span></h2>
            <p><span class="server-badge"><i class="fas fa-server"></i> Test Server 1.823.510</span><span><i class="fas fa-microchip"></i> SambaNova AI</span></p>
        </div>
        <div class="status-indicator"><div class="pulse-dot"></div><span>API Online</span></div>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" rows="1" placeholder="Написать..."></textarea>
            <button id="sendBtn"><i class="fas fa-arrow-up"></i></button>
        </div>
        <div class="info-footer"><i class="fas fa-robot"></i> RostOps — ваш персональный AI-ассистент в сфере бизнеса</div>
    </div>
</div>

<script>
    // ============================================
    // RostOps | SambaNova API — ПРОФЕССИОНАЛЬНЫЙ ТОН
    // Общение на ВЫ, уважительно, без панибратства
    // ============================================
    
    const API_KEY = "d1370880-8ba0-459b-aa2b-d730e63b44cb";
    const API_URL = "https://api.sambanova.ai/v1/chat/completions";
    
    const SYSTEM_PROMPT = `Ты — AI-ассистент компании RostOps, профессиональный бизнес-консультант по внедрению искусственного интеллекта и автоматизации бизнес-процессов.

СТИЛЬ ОБЩЕНИЯ:
- Обращайся к клиенту ТОЛЬКО на «Вы» (с большой буквы)
- Будь вежливым, уважительным, профессиональным
- Не используй панибратские обращения («дружище», «братан», «ты»)
- Держи деловой, но дружелюбный тон
- Отвечай чётко, по делу, без лишних эмоций

ПРАВИЛА:
- НИКОГДА НЕ ПИШИ КОД. Только текст, жирное выделение и списки.
- Отвечай ТОЛЬКО на русском языке
- Используй **жирный текст** для выделения важных терминов и услуг
- Всегда представляйся как ассистент RostOps
- Контакты компании: hello@rostops.ai
- Стоимость услуг: индивидуальный расчёт, пилотный проект от 250 000 рублей

УСЛУГИ КОМПАНИИ:
- Стратегия AI-трансформации и аудит процессов
- Кастомные LLM-агенты, чатботы (Telegram, сайты, CRM)
- Предиктивная аналитика (прогнозы продаж, оттока, оптимизация)
- Интеграция AI в CRM/ERP (1С, SAP, Битрикс24, Salesforce)
- Компьютерное зрение для контроля качества
- MLOps и облачные платформы
- Обучение AI-компетенциям команд

Твоя задача — помочь клиенту подобрать оптимальное AI-решение для его бизнеса. Отвечай профессионально и по существу.`;

    let conversationHistory = [];

    function getTime() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatMarkdown(text) {
        let safe = text.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
        
        safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        safe = safe.replace(/__(.*?)__/g, '<strong>$1</strong>');
        safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
        
        const lines = safe.split('\n');
        let inList = false;
        let result = [];
        
        for (let line of lines) {
            if (line.match(/^[\s]*[•\-*]\s/)) {
                if (!inList) {
                    result.push('<ul style="margin: 8px 0 8px 24px;">');
                    inList = true;
                }
                result.push(`<li style="margin: 4px 0;">${line.replace(/^[\s]*[•\-*]\s/, '')}</li>`);
            } else {
                if (inList) {
                    result.push('</ul>');
                    inList = false;
                }
                if (line.trim() === '') {
                    result.push('<br>');
                } else {
                    result.push(`<p style="margin: 8px 0;">${line}</p>`);
                }
            }
        }
        if (inList) result.push('</ul>');
        return result.join('');
    }

    function addMessage(role, text) {
        const container = document.getElementById('messagesArea');
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');
        messageDiv.classList.add(role === 'user' ? 'user-message' : 'assistant-message');

        const icon = document.createElement('div');
        icon.classList.add('message-icon');
        if (role === 'user') {
            icon.classList.add('user-icon');
            icon.innerHTML = '<i class="fas fa-user"></i>';
        } else {
            icon.classList.add('assistant-icon');
            icon.innerHTML = '<i class="fas fa-robot"></i>';
        }

        const bubbleWrapper = document.createElement('div');
        bubbleWrapper.style.display = 'flex';
        bubbleWrapper.style.flexDirection = 'column';
        bubbleWrapper.style.maxWidth = '100%';

        const bubble = document.createElement('div');
        bubble.classList.add('message-bubble');
        bubble.innerHTML = formatMarkdown(text);
        
        const timeSpan = document.createElement('div');
        timeSpan.classList.add('message-time');
        timeSpan.innerHTML = `<i class="far fa-clock"></i> ${getTime()}`;

        bubbleWrapper.appendChild(bubble);
        bubbleWrapper.appendChild(timeSpan);
        messageDiv.appendChild(icon);
        messageDiv.appendChild(bubbleWrapper);
        container.appendChild(messageDiv);
        container.scrollTop = container.scrollHeight;
    }

    let typingDiv = null;
    function showTyping() {
        if (typingDiv) return;
        const container = document.getElementById('messagesArea');
        const div = document.createElement('div');
        div.classList.add('message', 'assistant-message');
        div.id = 'typingMsg';
        const icon = document.createElement('div');
        icon.classList.add('message-icon', 'assistant-icon');
        icon.innerHTML = '<i class="fas fa-robot"></i>';
        const wrapper = document.createElement('div');
        wrapper.style.display = 'flex';
        wrapper.style.flexDirection = 'column';
        const typingBlock = document.createElement('div');
        typingBlock.className = 'typing-indicator';
        typingBlock.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span><span style="margin-left:6px;">Ассистент RostOps печатает...</span>';
        wrapper.appendChild(typingBlock);
        div.appendChild(icon);
        div.appendChild(wrapper);
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        typingDiv = div;
    }

    function hideTyping() {
        if (typingDiv) {
            typingDiv.remove();
            typingDiv = null;
        }
    }

    async function callAPI(userMessage, history) {
        const messages = [
            { role: "system", content: SYSTEM_PROMPT },
            ...history.slice(-10).map(msg => ({
                role: msg.role === 'user' ? 'user' : 'assistant',
                content: msg.content
            })),
            { role: "user", content: userMessage }
        ];

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "Meta-Llama-3.1-8B-Instruct",
                    messages: messages,
                    temperature: 0.7,
                    max_tokens: 800
                })
            });

            if (!response.ok) {
                const error = await response.json();
                console.error('API Error:', error);
                throw new Error(`API error: ${response.status}`);
            }

            const data = await response.json();
            return data.choices[0].message.content;
        } catch (error) {
            console.error('API call failed:', error);
            return "**Уважаемый клиент!**\n\nК сожалению, в данный момент возникли технические сложности с подключением к API. Пожалуйста, проверьте интернет-соединение и попробуйте снова. Если проблема сохранится, свяжитесь с нами по электронной почте: hello@rostops.ai";
        }
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        input.style.height = 'auto';

        addMessage('user', text);
        conversationHistory.push({ role: 'user', content: text });

        showTyping();
        await new Promise(r => setTimeout(r, 200));
        
        const reply = await callAPI(text, conversationHistory);
        hideTyping();

        addMessage('assistant', reply);
        conversationHistory.push({ role: 'assistant', content: reply });

        if (conversationHistory.length > 20) {
            conversationHistory = conversationHistory.slice(-16);
        }
    }

    function autoResize() {
        const ta = document.getElementById('userInput');
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 100) + 'px';
    }

    function init() {
        const container = document.getElementById('messagesArea');
        container.innerHTML = '';

        const welcomeMsg = `**Добро пожаловать в RostOps!**  

Я — AI-ассистент компании RostOps. Моя задача — помочь Вам с внедрением искусственного интеллекта в бизнес.

**Чем я могу быть Вам полезен:**  
• Разработать стратегию AI-трансформации  
• Подобрать решение для чат-ботов или аналитики  
• Интегрировать AI в CRM/ERP  
• Оценить стоимость и этапы внедрения  

Пожалуйста, опишите Вашу задачу, и я предоставлю профессиональную консультацию.

С уважением,  
Ассистент RostOps`;
        
        addMessage('assistant', welcomeMsg);
        conversationHistory = [{ role: 'assistant', content: welcomeMsg }];

        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        userInput.addEventListener('input', autoResize);
        userInput.focus();
        
        console.log('✅ RostOps AI ассистент запущен');
    }

    init();
</script>
</body>
</html>
